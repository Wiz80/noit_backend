id: instagram-competitor-full-analysis
namespace: noit.backend
description: "Complete Instagram competitor analysis workflow triggered by webhook"

inputs:
  - id: business_id
    type: STRING
    required: true
    description: "ID of the business idea"
  
  - id: competitor_id
    type: STRING
    required: true
    description: "ID of the competitor to analyze"
  
  - id: triggered_by
    type: STRING
    defaults: "webhook_trigger"
    description: "Source that triggered this workflow"

tasks:
  - id: log_workflow_start
    type: io.kestra.plugin.core.log.Log
    message: |
      🚀 Starting Instagram competitor full analysis
      Business ID: {{ inputs.business_id }}
      Competitor ID: {{ inputs.competitor_id }}
      Triggered by: {{ inputs.triggered_by }}

  - id: get_competitor_info
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://3.239.102.94:5432/business_ai"
    username: "noit-user-dev"
    password: "cm314i1UFAJxc"
    sql: |
      SELECT 
        c.id as competitor_id,
        c.business_idea_id,
        c.competitor_name,
        c.instagram_url,
        c.website,
        c.key_feature,
        bi.title as business_title,
        bi.description as business_description
      FROM competitors c
      LEFT JOIN business_ideas bi ON c.business_idea_id = bi.id
      WHERE c.id = '{{ inputs.competitor_id }}'
      AND c.business_idea_id = '{{ inputs.business_id }}'
      AND c.instagram_url IS NOT NULL
      AND LENGTH(TRIM(c.instagram_url)) > 0
    fetch: true

  - id: validate_competitor_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-alpine
    script: |
      import json
      import re
      
      # Get competitor data from previous query
      competitor_data = {{ outputs.get_competitor_info.rows }}
      
      print(f"🔍 Processing competitor data: {json.dumps(competitor_data, indent=2)}")
      
      if not competitor_data or len(competitor_data) == 0:
          raise Exception("No competitor found with the provided ID and business_id")
      
      competitor = competitor_data[0]
      
      # Validate required fields
      if not competitor.get('competitor_name'):
          raise Exception("Competitor name is required")
      
      if not competitor.get('instagram_url'):
          raise Exception("Instagram URL is required")
      
      # Extract Instagram username from URL
      instagram_url = competitor['instagram_url'].strip()
      
      # Handle different Instagram URL formats
      patterns = [
          r'instagram\.com/([^/?]+)',
          r'instagram\.com/([^/?]+)/',
          r'@([a-zA-Z0-9._]+)',
          r'^([a-zA-Z0-9._]+)$'
      ]
      
      instagram_username = None
      for pattern in patterns:
          match = re.search(pattern, instagram_url)
          if match:
              instagram_username = match.group(1)
              break
      
      if not instagram_username:
          raise Exception(f"Could not extract Instagram username from URL: {instagram_url}")
      
      # Clean the username (remove @ if present)
      instagram_username = instagram_username.lstrip('@')
      
      print(f"✅ Extracted Instagram username: {instagram_username}")
      
      # Create analysis configuration
      analysis_config = {
          "business_id": competitor['business_idea_id'],
          "competitor_id": competitor['competitor_id'],
          "competitor_name": competitor['competitor_name'],
          "instagram_url": instagram_url,
          "instagram_username": instagram_username,
          "website": competitor.get('website'),
          "key_feature": competitor.get('key_feature'),
          "business_title": competitor.get('business_title'),
          "business_description": competitor.get('business_description')
      }
      
      print(f"📋 Analysis config: {json.dumps(analysis_config, indent=2)}")
      
      # Save configuration to file (using current directory instead of /tmp)
      with open('analysis_config.json', 'w') as f:
          json.dump(analysis_config, f, indent=2)
      
      # Verify the file was created and read it back
      import os
      if os.path.exists('analysis_config.json'):
          with open('analysis_config.json', 'r') as f:
              saved_config = json.load(f)
          print(f"✅ File saved successfully, size: {os.path.getsize('analysis_config.json')} bytes")
          print(f"🔍 File contents: {json.dumps(saved_config, indent=2)}")
          print(f"📁 Current directory: {os.getcwd()}")
          print(f"📋 Directory contents: {os.listdir('.')}")
      else:
          print("❌ ERROR: File was not created!")
          raise Exception("Failed to create analysis_config.json file")
      
      print("💾 Analysis configuration saved and verified successfully")
    outputFiles:
      - "analysis_config.json"

  - id: get_auth_token
    type: io.kestra.plugin.core.http.Request
    uri: "http://app:8000/api/v1/auth/login"
    method: "POST"
    contentType: "application/x-www-form-urlencoded"
    body: "grant_type=&username={{ secret('SUPERUSER_EMAIL') }}&password={{ secret('SUPERUSER_PASSWORD') }}&scope=&client_id=&client_secret="
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: step_1_start_instagram_analysis
    type: io.kestra.plugin.core.http.Request
    uri: "http://app:8000/api/v1/analyze-competitors/instagram/{{ inputs.business_id }}/competitor/{{ inputs.competitor_id }}?results_limit=2&max_comments=2"
    method: "POST"
    contentType: "application/json"
    headers:
      Content-Type: "application/json"
      User-Agent: "Kestra-Instagram-Analysis/1.0"
      Authorization: "Bearer {{ json(outputs.get_auth_token.body).access_token }}"
    body: |
      {}
    timeout: "PT120S"

  - id: debug_outputs
    type: io.kestra.plugin.core.log.Log
    message: |
      🔍 Debugging outputs before monitoring:
      validate_competitor_data outputFiles: {{ outputs.validate_competitor_data.outputFiles }}
      step_1_start_instagram_analysis: {{ outputs.step_1_start_instagram_analysis }}

  - id: monitor_step_1_progress
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "noit_network"
    beforeCommands:
      - pip install requests
      - apk add --no-cache bind-tools curl
      - echo "--- Network Debugging ---"
      - nslookup app
      - curl -I -v http://app:8000/health || echo "Curl to health endpoint failed"
      - echo "--- End Network Debugging ---"
    inputFiles:
      analysis_config.json: "{{ outputs.validate_competitor_data.outputFiles['analysis_config.json'] }}"
    script: |
      import json
      import time
      import requests
      import os
      
      # Debug: Check if file exists and list files
      print("📁 Checking current directory contents:")
      for file in os.listdir('.'):
          print(f"  - {file}")
      
      # Get analysis config from input file
      if os.path.exists('analysis_config.json'):
          print("✅ analysis_config.json found!")
          with open('analysis_config.json', 'r') as f:
              analysis_config = json.load(f)
          print(f"📋 Config loaded: {analysis_config}")
      else:
          print("❌ analysis_config.json NOT found!")
          raise Exception("analysis_config.json file not found in working directory")
      
      step_1_response = {{ outputs.step_1_start_instagram_analysis }}
      business_id = analysis_config['business_id']
      
      print(f"📈 Monitoring Step 1: Instagram scraping analysis")
      print(f"Step 1 response: {json.dumps(step_1_response, indent=2)}")
      
      # Extract task_id from response
      response_body = step_1_response.get('body', {})
      if isinstance(response_body, str):
          try:
              response_body = json.loads(response_body)
          except:
              print("Could not parse response body as JSON")
              response_body = {}
      
      task_id = response_body.get('task_id')
      if not task_id:
          print("❌ No task_id found in response")
          raise Exception("No task_id returned from Step 1")
      
      print(f"🎯 Task ID: {task_id}")
      
      # Monitor progress (simplified - in production you might want more sophisticated monitoring)
      max_wait_time = 600  # 10 minutes
      check_interval = 30  # 30 seconds
      elapsed_time = 0
      
      while elapsed_time < max_wait_time:
          try:
              progress_url = f"http://app:8000/api/v1/analyze-competitors/instagram/{business_id}/task/{task_id}"
              response = requests.get(progress_url, timeout=30)
              
              if response.status_code == 200:
                  progress_data = response.json()
                  status = progress_data.get('status', 'unknown')
                  progress = progress_data.get('progress', 0)
                  
                  print(f"📊 Progress: {progress}%, Status: {status}")
                  
                  if status in ['completed', 'success']:
                      print("✅ Step 1 completed successfully")
                      break
                  elif status in ['failed', 'error']:
                      print(f"❌ Step 1 failed: {progress_data.get('error', 'Unknown error')}")
                      raise Exception(f"Step 1 failed: {progress_data.get('error', 'Unknown error')}")
                  
              time.sleep(check_interval)
              elapsed_time += check_interval
              
          except Exception as e:
              print(f"⚠️ Error checking progress: {str(e)}")
              time.sleep(check_interval)
              elapsed_time += check_interval
      
      if elapsed_time >= max_wait_time:
          print("⏰ Step 1 monitoring timed out")
          # Don't fail completely, continue to next step
      
      print("🎉 Step 1 monitoring completed")

  - id: step_2_comments_analysis
    type: io.kestra.plugin.core.http.Request
    uri: "http://app:8000/api/v1/analyze-competitors/instagram-comments/{{ inputs.business_id }}/complete-comments-analysis"
    method: "POST"
    contentType: "application/json"
    headers:
      Content-Type: "application/json"
      User-Agent: "Kestra-Instagram-Analysis/1.0"
      Authorization: "Bearer {{ json(outputs.get_auth_token.body).access_token }}"
    body: |
      {
        "username": "{{ json(read(outputs.validate_competitor_data.outputFiles['analysis_config.json'])).instagram_username }}",
        "num_topics": 2,
        "max_comments": 2,
        "provider": "openai",
        "model": "gpt-4o-mini",
        "lang": "es",
        "run_in_background": false
      }
    timeout: "PT300S"

  - id: step_3_image_analysis
    type: io.kestra.plugin.core.http.Request
    uri: "http://app:8000/api/v1/analyze-competitors/instagram-image-analyzer/{{ inputs.business_id }}/complete-image-analysis"
    method: "POST"
    contentType: "application/json"
    headers:
      Content-Type: "application/json"
      User-Agent: "Kestra-Instagram-Analysis/1.0"
      Authorization: "Bearer {{ json(outputs.get_auth_token.body).access_token }}"
    body: |
      {
        "instagram_username": "{{ json(read(outputs.validate_competitor_data.outputFiles['analysis_config.json'])).instagram_username }}",
        "posts_limit": 2,
        "run_in_background": false
      }
    timeout: "PT600S"

  - id: step_4_statistics_analysis
    type: io.kestra.plugin.core.http.Request
    uri: "http://app:8000/api/v1/analyze-competitors/instagram-statistics/{{ inputs.business_id }}/complete-statistics-analysis"
    method: "POST"
    contentType: "application/json"
    headers:
      Content-Type: "application/json"
      User-Agent: "Kestra-Instagram-Analysis/1.0"
      Authorization: "Bearer {{ json(outputs.get_auth_token.body).access_token }}"
    body: |
      {
        "username": "{{ json(read(outputs.validate_competitor_data.outputFiles['analysis_config.json'])).instagram_username }}",
        "post_limit": 2,
        "image_limit": 2,
        "run_in_background": false
      }
    timeout: "PT300S"
triggers:
  - id: instagram_analysis_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "instagram_competitor_analysis_trigger"
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionOutputs
        expression: "{{ trigger.body.business_id != null && trigger.body.competitor_id != null }}" 