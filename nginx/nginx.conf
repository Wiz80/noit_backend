user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Incluir configuraciones adicionales
    include /etc/nginx/conf.d/*.conf;
    
    # La configuración del servidor HTTPS solo se cargará si los certificados existen
    server {
        listen 443 ssl default_server;
        server_name _;
        
        # Certificado autofirmado temporal para iniciar
        ssl_certificate /etc/nginx/conf.d/dummy.crt;
        ssl_certificate_key /etc/nginx/conf.d/dummy.key;
        
        # Redirección para evitar errores de certificados
        return 444;
    }
    
    # HTTPS server (solo activado cuando los certificados existen)
    server {
        listen 443 ssl;
        server_name noit.com.co www.noit.com.co;
        
        # Certificados SSL
        ssl_certificate /etc/letsencrypt/live/noit.com.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/noit.com.co/privkey.pem;
        
        # Configuración de seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # Proxy a servicio app
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Soporte para Websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
} 