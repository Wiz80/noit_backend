volumes:
  postgres-data:
    driver: local
  redis_data:
    driver: local
  taskiq-admin-data:
    driver: local

services:
  redis:
    image: redis:6.2-alpine
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  # Nginx Proxy Reverso
  nginx:
    image: nginx:alpine
    container_name: noit_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Application - Producción
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noit_fastapi_app
    command: >
      bash -c "
        echo '🚀 Starting FastAPI production server with Gunicorn...' &&
        gunicorn app.main:app 
        -w 4 
        -k uvicorn.workers.UvicornWorker 
        --bind 0.0.0.0:8000 
        --timeout 120 
        --keep-alive 5 
        --max-requests 1000 
        --max-requests-jitter 100 
        --preload 
        --access-logfile - 
        --error-logfile - 
        --log-level info
      "
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=supersecret
      - TASKIQ_BROKER_NAME=noit_backend_app_prod
      - ENVIRONMENT=production
    env_file:
      - .env.prod
    depends_on:
      - redis
      - taskiq-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Taskiq Worker - Producción
  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker_prod
    command: >
      bash -c "
        echo '🚀 Starting Taskiq worker for production...' &&
        taskiq worker app.tasks.broker:broker 
        --workers 4 
        --max-async-tasks 20 
        --fs-discover 
        --log-level info
      "
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=supersecret
      - TASKIQ_BROKER_NAME=noit_backend_worker_prod
      - ENVIRONMENT=production
    env_file:
      - .env.prod
    depends_on:
      - redis
      - taskiq-admin
    restart: unless-stopped
    deploy:
      replicas: 2  # Múltiples instancias del worker

  # Taskiq Admin Dashboard - Solo para monitoring en prod
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    container_name: taskiq_admin_prod
    expose:
      - "3000"
    environment:
      - TASKIQ_ADMIN_API_TOKEN=supersecret
    volumes:
      - taskiq-admin-data:/usr/database/
    depends_on:
      - redis
    restart: unless-stopped 