
services:
  postgres:
    image: postgres:14
    volumes:
      - /data/postgres/pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: always
  
  postgres_kestra:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${KESTRA_POSTGRES_DB:-kestra}
      POSTGRES_USER: ${KESTRA_POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:6.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD}"]
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noit_fastapi_app
    command: >
      bash -c "
        echo '🚀 Starting FastAPI application with Gunicorn + Uvicorn workers...' &&
        gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile -
      "
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=${TASKIQ_ADMIN_API_TOKEN}
      - TASKIQ_BROKER_NAME=noit_backend_app
    env_file:
      - .env
    depends_on:
      - redis
      - taskiq-admin
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.21-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - app
    restart: always
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  
  # Taskiq Worker
  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker
    command: >
      bash -c "
        echo '🚀 Starting Taskiq worker...' &&
        taskiq worker app.tasks.broker:broker 
        --workers 2 
        --max-async-tasks 10 
        --fs-discover
      "
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=${TASKIQ_ADMIN_API_TOKEN}
      - TASKIQ_BROKER_NAME=noit_backend_worker
    env_file:
      - .env
    depends_on:
      - redis
      - taskiq-admin
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped

  # Taskiq Admin Dashboard
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    container_name: taskiq_admin
    ports:
      - "${TASKIQ_ADMIN_PORT:-3000}:3000"
    environment:
      - TASKIQ_ADMIN_API_TOKEN=${TASKIQ_ADMIN_API_TOKEN}
    volumes:
      - taskiq-admin-data:/usr/database/
    depends_on:
      - redis

  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres_kestra:5432/${KESTRA_POSTGRES_DB:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_POSTGRES_USER:-kestra}
            password: ${KESTRA_POSTGRES_PASSWORD}
        kestra:
          server:
            basicAuth:
              enabled: ${KESTRA_BASIC_AUTH_ENABLED:-false}
              username: "${KESTRA_ADMIN_EMAIL:-admin@localhost.dev}"
              password: ${KESTRA_ADMIN_PASSWORD:-kestra}
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: ${KESTRA_URL:-http://localhost:8080/}
    ports:
      - "${KESTRA_PORT:-8080}:8080"
      - "${KESTRA_MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres_kestra:
        condition: service_started

volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
  redis_data:
    driver: local
  taskiq-admin-data:
    driver: local