volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
  redis_data:
    driver: local
  taskiq-admin-data:
    driver: local

networks:
  noit_network:
    driver: bridge
    name: noit_network

services:
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - noit_network

  redis:
    image: redis:6.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - noit_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noit_fastapi_app
    command: >
      bash -c "
        echo '🚀 Starting FastAPI application with Gunicorn + Uvicorn workers...' &&
        gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile -
      "
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=${TASKIQ_ADMIN_API_TOKEN}
      - TASKIQ_BROKER_NAME=noit_backend_app
    env_file:
      - .env
    depends_on:
      - redis
      - taskiq-admin
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - noit_network

  # Taskiq Worker
  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker
    command: >
      bash -c "
        echo '🚀 Starting Taskiq worker...' &&
        taskiq worker app.tasks.broker:broker 
        --workers 2 
        --max-async-tasks 10 
        --fs-discover
      "
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=supersecret
      - TASKIQ_BROKER_NAME=noit_backend_worker
    env_file:
      - .env
    depends_on:
      - redis
      - taskiq-admin
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    networks:
      - noit_network

  # Taskiq Admin Dashboard
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    container_name: taskiq_admin
    ports:
      - "3000:3000"
    environment:
      - TASKIQ_ADMIN_API_TOKEN=supersecret
    volumes:
      - taskiq-admin-data:/usr/database/
    depends_on:
      - redis
    networks:
      - noit_network

  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              enabled: false
              username: "admin@localhost.dev" # it must be a valid email address
              password: kestra
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          tutorialFlows:
            enabled: false
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - noit_network