volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
  redis_data:
    driver: local
  taskiq-admin-data:
    driver: local

services:
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TARGETPLATFORM=linux/amd64
        - BUILDPLATFORM=linux/amd64
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  # Taskiq Worker
  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker
    command: >
      bash -c "
        echo '🚀 Starting Taskiq worker...' &&
        taskiq worker app.tasks.broker:broker 
        --workers 2 
        --max-async-tasks 10 
        --fs-discover
      "
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TASKIQ_ADMIN_URL=http://taskiq-admin:3000
      - TASKIQ_ADMIN_API_TOKEN=supersecret
      - TASKIQ_BROKER_NAME=noit_backend_worker
    env_file:
      - .env
    depends_on:
      - redis
      - taskiq-admin
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped

  # Taskiq Admin Dashboard
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    container_name: taskiq_admin
    ports:
      - "3000:3000"
    environment:
      - TASKIQ_ADMIN_API_TOKEN=supersecret
    volumes:
      - taskiq-admin-data:/usr/database/
    depends_on:
      - redis

  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              enabled: false
              username: "admin@localhost.dev" # it must be a valid email address
              password: kestra
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_started