id: start-competitor-analysis
namespace: noit.backend
description: "Webhook-triggered pipeline to start competitor analysis when business models are completed"

inputs:
  - id: business_id
    type: STRING
    required: true
    description: "ID of the business that completed ETAPA 1"
  
  - id: triggered_by
    type: STRING
    defaults: "brief_completion"
    description: "Source that triggered this workflow"

tasks:
  - id: log_webhook_trigger
    type: io.kestra.plugin.core.log.Log
    message: |
      🔔 Webhook triggered for business model completion
      Business ID: {{ inputs.business_id }}
      Triggered by: {{ inputs.triggered_by }}

  - id: validate_business_exists
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://44.204.96.182:5432/business_ai"
    username: "noit-user-dev"
    password: "password"
    sql: |
      SELECT 
        bm.id as business_model_id,
        bm.business_id,
        bm.problem_definition,
        bm.industry,
        bm.customer_persona,
        bm.value_proposition,
        bm.competitive_advantage,
        bm.products_services,
        bm.challenges_opportunities,
        bm.created_at,
        bm.updated_at,
        bi.title as business_title,
        bi.description as business_description,
        -- Check if there's already a pending competitor research
        CASE 
          WHEN EXISTS (
            SELECT 1 FROM competitor_research cr 
            WHERE cr.business_id = bm.business_id 
            AND cr.status = 'PENDING'
          ) THEN true 
          ELSE false 
        END as has_pending_research
      FROM business_models bm
      LEFT JOIN business_ideas bi ON bm.business_id = bi.id
      WHERE bm.business_id = '{{ inputs.business_id }}'
      AND bm.industry IS NOT NULL 
      AND bm.customer_persona IS NOT NULL
      AND LENGTH(TRIM(bm.industry)) > 0
      AND LENGTH(TRIM(bm.customer_persona)) > 0
    store: true

  - id: trigger_competitor_analysis
    type: io.kestra.plugin.core.http.Request
    uri: "http://host.docker.internal:8000/api/v1/analyze-competitors/{{ inputs.business_id }}"
    method: "POST"
    contentType: "application/json"
    headers:
      Content-Type: "application/json"
      User-Agent: "Kestra-Webhook-Pipeline/1.0"
    body: |
      {
        "business_id": "{{ inputs.business_id }}",
        "language": "es",
        "validator_provider": "openai",
        "validator_model": "openai:gpt-4o-mini",
        "research_model": "sonar-deep-research",
        "base_url": "http://host.docker.internal:8000",
        "triggered_by": "{{ inputs.triggered_by }}"
      }
    timeout: "PT30S"

  - id: process_analysis_response
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-alpine
    script: |
      import json
      
      # Check the response from the competitor analysis trigger
      trigger_response = {{ outputs.trigger_competitor_analysis }}
      business_id = "{{ inputs.business_id }}"
      
      print(f"🔍 Analysis response for business {business_id}:")
      print(f"Status Code: {trigger_response.get('code', 'Unknown')}")
      
      # Parse response body
      body = trigger_response.get('body', {})
      if isinstance(body, str):
          try:
              body = json.loads(body)
          except:
              print("Could not parse response body as JSON")
              body = {}
      
      print(f"Response Body: {json.dumps(body, indent=2)}")
      
      # Check if successful
      status_code = trigger_response.get('code', 500)
      if status_code in [200, 202]:
          print("✅ Competitor analysis successfully triggered")
          
          request_id = body.get('request_id', 'Unknown') if isinstance(body, dict) else 'Unknown'
          print(f"📋 Request ID: {request_id}")
          
          # Store success info
          with open('/tmp/analysis_result.json', 'w') as f:
              json.dump({
                  "success": True,
                  "business_id": business_id,
                  "request_id": request_id,
                  "status_code": status_code,
                  "message": body.get('message', 'Analysis started') if isinstance(body, dict) else 'Analysis started'
              }, f, indent=2)
          
      else:
          print(f"❌ Failed to trigger competitor analysis")
          print(f"Error details: {body}")
          
          # Store error info but don't fail the workflow
          with open('/tmp/analysis_result.json', 'w') as f:
              json.dump({
                  "success": False,
                  "business_id": business_id,
                  "status_code": status_code,
                  "error": body,
                  "message": "Failed to trigger analysis"
              }, f, indent=2)
    outputFiles:
      - "/tmp/analysis_result.json"

  - id: log_completion
    type: io.kestra.plugin.core.log.Log
    message: |
      🎯 Webhook processing completed for business: {{ inputs.business_id }}
      
      Analysis Result: {{ json(outputs.process_analysis_response.outputFiles['/tmp/analysis_result.json']).success ? '✅ SUCCESS' : '❌ FAILED' }}
      
      Request ID: {{ json(outputs.process_analysis_response.outputFiles['/tmp/analysis_result.json']).request_id ?? 'N/A' }}
      
      Business Details:
      - Title: {{ inputs.business_title ?? 'Unknown' }}
      - Industry: {{ inputs.industry ?? 'Unknown' }}
      - Triggered by: {{ inputs.triggered_by }}

triggers:
  - id: business_model_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "competitor_analysis_trigger"
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionOutputs
        expression: "{{ trigger.body.event == 'business_model_completed' }}"

  - id: manual_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "competitor_analysis_trigger"