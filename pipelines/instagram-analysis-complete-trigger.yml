id: instagram-analysis-complete-trigger
namespace: noit.backend
description: "Pipeline to run complete Instagram analysis after social media extraction completes"

inputs:
  - id: business_id
    type: STRING
    required: false
    description: "Business ID to analyze (if not provided, will process all recent updates)"
  
  - id: competitor_ids
    type: ARRAY
    itemType: STRING
    required: false
    description: "Specific competitor IDs to analyze"
    
  - id: triggered_by
    type: STRING
    defaults: "social_media_extraction"
    description: "Source that triggered this workflow"

  - id: max_concurrent_analysis
    type: INT
    defaults: 2
    description: "Maximum number of concurrent Instagram analyses"

  - id: wait_timeout_minutes
    type: INT
    defaults: 30
    description: "Timeout in minutes to wait for each analysis step"

tasks:
  - id: log_pipeline_start
    type: io.kestra.plugin.core.log.Log
    message: |
      🚀 Starting Complete Instagram Analysis Pipeline
      Business ID: {{ inputs.business_id ?? 'Auto-detect from recent updates' }}
      Triggered by: {{ inputs.triggered_by }}
      Max concurrent: {{ inputs.max_concurrent_analysis }}
      Timeout: {{ inputs.wait_timeout_minutes }} minutes

  - id: check_database_connection
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://44.204.96.182:5432/business_ai"
    username: "noit-user-dev"
    password: "password"
    sql: "SELECT NOW() as current_time;"
    store: true

  - id: find_competitors_with_instagram
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://44.204.96.182:5432/business_ai"
    username: "noit-user-dev"
    password: "password"
    sql: |
      SELECT 
        c.id as competitor_id,
        c.business_idea_id,
        c.competitor_name,
        c.website,
        c.instagram_url,
        REGEXP_REPLACE(c.instagram_url, '^https?://(?:www\.)?instagram\.com/([^/?]+).*$', '\1') as instagram_username,
        bi.title as business_title,
        c.updated_at,
        c.created_at
      FROM competitors c
      LEFT JOIN business_ideas bi ON c.business_idea_id = bi.id
      WHERE c.instagram_url IS NOT NULL 
        AND c.instagram_url != ''
        AND c.instagram_url LIKE '%instagram.com%'
        {% if inputs.business_id %}
        AND c.business_idea_id = '{{ inputs.business_id }}'
        {% endif %}
        {% if inputs.competitor_ids %}
        AND c.id = ANY(ARRAY[{% for id in inputs.competitor_ids %}'{{ id }}'{% if not loop.last %},{% endif %}{% endfor %}])
        {% else %}
        -- Find recently updated competitors (last 6 hours) if no specific IDs provided
        AND (c.updated_at > NOW() - INTERVAL '6 hours' OR c.created_at > NOW() - INTERVAL '6 hours')
        {% endif %}
      ORDER BY c.updated_at DESC, c.created_at DESC
      LIMIT 10;
    store: true

  - id: process_instagram_competitors
    type: io.kestra.plugin.core.flow.EachSequential
    value: "{{ outputs.find_competitors_with_instagram.rows }}"
    tasks:
      - id: log_competitor_start
        type: io.kestra.plugin.core.log.Log
        message: |
          📱 Starting Instagram analysis for competitor: {{ taskrun.value.competitor_name }}
          Business: {{ taskrun.value.business_title }}
          Instagram: {{ taskrun.value.instagram_url }}
          Username: {{ taskrun.value.instagram_username }}
          Business ID: {{ taskrun.value.business_idea_id }}
          Competitor ID: {{ taskrun.value.competitor_id }}

      # Step 1: Initial Instagram Competitor Analysis
      - id: step1_instagram_competitor_analysis
        type: io.kestra.plugin.core.http.Request
        uri: "http://host.docker.internal:8000/api/v1/business/competitive-analysis/instagram/{{ taskrun.value.business_idea_id }}"
        method: "POST"
        contentType: "application/json"
        headers:
          Content-Type: "application/json"
          User-Agent: "Kestra-Instagram-Pipeline/1.0"
        body: |
          {
            "competitors_ids": ["{{ taskrun.value.competitor_id }}"]
          }
        timeout: "PT{{ inputs.wait_timeout_minutes }}M"

      - id: process_step1_response
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          import time
          
          response = {{ outputs.step1_instagram_competitor_analysis }}
          competitor_name = "{{ taskrun.value.competitor_name }}"
          business_id = "{{ taskrun.value.business_idea_id }}"
          
          print(f"🔍 Step 1 - Instagram analysis response for {competitor_name}:")
          print(f"Status Code: {response.get('code', 'Unknown')}")
          
          body = response.get('body', {})
          if isinstance(body, str):
              try:
                  body = json.loads(body)
              except:
                  body = {}
          
          success = response.get('code', 500) in [200, 202]
          task_id = body.get('task_id', 'Unknown') if isinstance(body, dict) else 'Unknown'
          
          result = {
              "step": "instagram_analysis",
              "success": success,
              "task_id": task_id,
              "status_code": response.get('code', 500),
              "message": body.get('message', 'No message') if isinstance(body, dict) else 'Unknown response'
          }
          
          with open('/tmp/step1_result.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          if success:
              print(f"✅ Step 1 SUCCESS - Task ID: {task_id}")
          else:
              print(f"❌ Step 1 FAILED - Error: {body}")
        outputFiles:
          - "/tmp/step1_result.json"

      # Wait for Step 1 to complete before proceeding
      - id: wait_step1_completion
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          import time
          import urllib.request
          import urllib.parse
          
          # Load step 1 result
          with open('/tmp/step1_result.json', 'r') as f:
              step1_result = json.load(f)
          
          if not step1_result.get('success', False):
              print("❌ Step 1 failed, skipping wait")
              exit(0)
          
          task_id = step1_result.get('task_id')
          business_id = "{{ taskrun.value.business_idea_id }}"
          
          if task_id == 'Unknown':
              print("⚠️ No task ID available, proceeding without wait")
              exit(0)
          
          # Wait for task completion (simplified polling)
          max_wait_minutes = {{ inputs.wait_timeout_minutes }}
          wait_seconds = max_wait_minutes * 60
          poll_interval = 30  # Poll every 30 seconds
          
          print(f"⏳ Waiting up to {max_wait_minutes} minutes for Step 1 completion...")
          print(f"Task ID: {task_id}")
          
          for i in range(0, wait_seconds, poll_interval):
              try:
                  # Simple wait - in production you'd poll the task status endpoint
                  time.sleep(poll_interval)
                  print(f"⏳ Waiting... {i//60}m {i%60}s elapsed")
                  
                  # For now, assume it completes after reasonable time
                  if i >= 300:  # 5 minutes minimum wait
                      print("✅ Assuming Step 1 completed after minimum wait time")
                      break
                      
              except Exception as e:
                  print(f"⚠️ Error during wait: {e}")
                  break
          
          print("🎯 Step 1 wait completed, proceeding to Step 2")

      # Step 2: Comments Analysis
      - id: step2_comments_analysis
        type: io.kestra.plugin.core.http.Request
        uri: "http://host.docker.internal:8000/api/v1/business/competitive-analysis/instagram/{{ taskrun.value.business_idea_id }}/complete-comments-analysis"
        method: "POST"
        contentType: "application/json"
        headers:
          Content-Type: "application/json"
          User-Agent: "Kestra-Instagram-Pipeline/1.0"
        body: |
          {
            "username": "{{ taskrun.value.instagram_username }}",
            "num_topics": 5,
            "max_comments": 100,
            "provider": "openai",
            "model": "openai:gpt-4o-mini",
            "lang": "es",
            "run_in_background": true
          }
        timeout: "PT{{ inputs.wait_timeout_minutes }}M"

      - id: process_step2_response
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          
          response = {{ outputs.step2_comments_analysis }}
          competitor_name = "{{ taskrun.value.competitor_name }}"
          username = "{{ taskrun.value.instagram_username }}"
          
          print(f"🔍 Step 2 - Comments analysis response for {competitor_name} (@{username}):")
          print(f"Status Code: {response.get('code', 'Unknown')}")
          
          body = response.get('body', {})
          if isinstance(body, str):
              try:
                  body = json.loads(body)
              except:
                  body = {}
          
          success = response.get('code', 500) in [200, 202]
          task_id = body.get('task_id', 'Unknown') if isinstance(body, dict) else 'Unknown'
          
          result = {
              "step": "comments_analysis",
              "success": success,
              "task_id": task_id,
              "status_code": response.get('code', 500),
              "message": body.get('message', 'No message') if isinstance(body, dict) else 'Unknown response'
          }
          
          with open('/tmp/step2_result.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          if success:
              print(f"✅ Step 2 SUCCESS - Task ID: {task_id}")
          else:
              print(f"❌ Step 2 FAILED - Error: {body}")
        outputFiles:
          - "/tmp/step2_result.json"

      # Step 3: Image Analysis  
      - id: step3_image_analysis
        type: io.kestra.plugin.core.http.Request
        uri: "http://host.docker.internal:8000/api/v1/business/competitive-analysis/instagram/{{ taskrun.value.business_idea_id }}/complete-image-analysis"
        method: "POST"
        contentType: "application/json"
        headers:
          Content-Type: "application/json"
          User-Agent: "Kestra-Instagram-Pipeline/1.0"
        body: |
          {
            "instagram_username": "{{ taskrun.value.instagram_username }}",
            "posts_limit": 20,
            "run_in_background": true
          }
        timeout: "PT{{ inputs.wait_timeout_minutes }}M"

      - id: process_step3_response
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          
          response = {{ outputs.step3_image_analysis }}
          competitor_name = "{{ taskrun.value.competitor_name }}"
          username = "{{ taskrun.value.instagram_username }}"
          
          print(f"🔍 Step 3 - Image analysis response for {competitor_name} (@{username}):")
          print(f"Status Code: {response.get('code', 'Unknown')}")
          
          body = response.get('body', {})
          if isinstance(body, str):
              try:
                  body = json.loads(body)
              except:
                  body = {}
          
          success = response.get('code', 500) in [200, 202]
          task_id = body.get('task_id', 'Unknown') if isinstance(body, dict) else 'Unknown'
          
          result = {
              "step": "image_analysis",
              "success": success,
              "task_id": task_id,
              "status_code": response.get('code', 500),
              "message": body.get('message', 'No message') if isinstance(body, dict) else 'Unknown response'
          }
          
          with open('/tmp/step3_result.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          if success:
              print(f"✅ Step 3 SUCCESS - Task ID: {task_id}")
          else:
              print(f"❌ Step 3 FAILED - Error: {body}")
        outputFiles:
          - "/tmp/step3_result.json"

      # Step 4: Statistics Analysis
      - id: step4_statistics_analysis
        type: io.kestra.plugin.core.http.Request
        uri: "http://host.docker.internal:8000/api/v1/business/competitive-analysis/instagram/{{ taskrun.value.business_idea_id }}/complete-statistics-analysis"
        method: "POST"
        contentType: "application/json"
        headers:
          Content-Type: "application/json"
          User-Agent: "Kestra-Instagram-Pipeline/1.0"
        body: |
          {
            "username": "{{ taskrun.value.instagram_username }}",
            "post_limit": 50,
            "image_limit": 10,
            "run_in_background": true
          }
        timeout: "PT{{ inputs.wait_timeout_minutes }}M"

      - id: process_step4_response
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          
          response = {{ outputs.step4_statistics_analysis }}
          competitor_name = "{{ taskrun.value.competitor_name }}"
          username = "{{ taskrun.value.instagram_username }}"
          
          print(f"🔍 Step 4 - Statistics analysis response for {competitor_name} (@{username}):")
          print(f"Status Code: {response.get('code', 'Unknown')}")
          
          body = response.get('body', {})
          if isinstance(body, str):
              try:
                  body = json.loads(body)
              except:
                  body = {}
          
          success = response.get('code', 500) in [200, 202]
          task_id = body.get('task_id', 'Unknown') if isinstance(body, dict) else 'Unknown'
          
          result = {
              "step": "statistics_analysis",
              "success": success,
              "task_id": task_id,
              "status_code": response.get('code', 500),
              "message": body.get('message', 'No message') if isinstance(body, dict) else 'Unknown response'
          }
          
          with open('/tmp/step4_result.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          if success:
              print(f"✅ Step 4 SUCCESS - Task ID: {task_id}")
          else:
              print(f"❌ Step 4 FAILED - Error: {body}")
        outputFiles:
          - "/tmp/step4_result.json"

      # Summary for this competitor
      - id: competitor_analysis_summary
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.11-alpine
        script: |
          import json
          from datetime import datetime
          
          competitor_name = "{{ taskrun.value.competitor_name }}"
          username = "{{ taskrun.value.instagram_username }}"
          business_title = "{{ taskrun.value.business_title }}"
          
          # Load all step results
          steps_results = {}
          
          try:
              with open('/tmp/step1_result.json', 'r') as f:
                  steps_results['step1'] = json.load(f)
          except:
              steps_results['step1'] = {"success": False, "error": "No result file"}
          
          try:
              with open('/tmp/step2_result.json', 'r') as f:
                  steps_results['step2'] = json.load(f)
          except:
              steps_results['step2'] = {"success": False, "error": "No result file"}
          
          try:
              with open('/tmp/step3_result.json', 'r') as f:
                  steps_results['step3'] = json.load(f)
          except:
              steps_results['step3'] = {"success": False, "error": "No result file"}
          
          try:
              with open('/tmp/step4_result.json', 'r') as f:
                  steps_results['step4'] = json.load(f)
          except:
              steps_results['step4'] = {"success": False, "error": "No result file"}
          
          # Calculate success rate
          successful_steps = sum(1 for step in steps_results.values() if step.get('success', False))
          total_steps = len(steps_results)
          success_rate = (successful_steps / total_steps) * 100
          
          summary = {
              "competitor_name": competitor_name,
              "instagram_username": username,
              "business_title": business_title,
              "analysis_completed_at": datetime.now().isoformat(),
              "total_steps": total_steps,
              "successful_steps": successful_steps,
              "success_rate": success_rate,
              "steps_details": steps_results,
              "overall_status": "completed" if successful_steps == total_steps else "partial" if successful_steps > 0 else "failed"
          }
          
          with open('/tmp/competitor_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          
          print(f"📊 Analysis Summary for {competitor_name} (@{username}):")
          print(f"   Success Rate: {success_rate:.1f}% ({successful_steps}/{total_steps})")
          print(f"   Overall Status: {summary['overall_status'].upper()}")
          
          for step_name, step_data in steps_results.items():
              status = "✅ SUCCESS" if step_data.get('success') else "❌ FAILED"
              print(f"   {step_name}: {status}")
        outputFiles:
          - "/tmp/competitor_summary.json"

      - id: log_competitor_completion
        type: io.kestra.plugin.core.log.Log
        message: |
          🎯 Completed Instagram analysis for competitor: {{ taskrun.value.competitor_name }}
          
          Username: @{{ taskrun.value.instagram_username }}
          Business: {{ taskrun.value.business_title }}
          
          Analysis Summary: {{ json(outputs.competitor_analysis_summary.outputFiles['/tmp/competitor_summary.json']) }}

  - id: generate_final_report
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-alpine
    script: |
      import json
      from datetime import datetime
      
      # Get the list of competitors that were processed
      competitors = {{ outputs.find_competitors_with_instagram.rows }}
      
      print("📊 Instagram Analysis Pipeline Final Report")
      print("=" * 60)
      print(f"Execution Time: {datetime.now().isoformat()}")
      print(f"Total Competitors Found: {len(competitors)}")
      print(f"Triggered by: {{ inputs.triggered_by }}")
      
      if competitors:
          print(f"\n📱 Processed Instagram Competitors:")
          for i, competitor in enumerate(competitors, 1):
              print(f"{i}. {competitor.get('competitor_name', 'Unknown')}")
              print(f"   Instagram: @{competitor.get('instagram_username', 'N/A')}")
              print(f"   Business: {competitor.get('business_title', 'N/A')}")
              print(f"   URL: {competitor.get('instagram_url', 'N/A')}")
              print()
      else:
          print("\n✅ No Instagram competitors found for analysis.")
      
      # Generate final summary
      final_summary = {
          "pipeline": "instagram-analysis-complete",
          "execution_time": datetime.now().isoformat(),
          "triggered_by": "{{ inputs.triggered_by }}",
          "total_competitors_found": len(competitors),
          "business_id": "{{ inputs.business_id }}" if "{{ inputs.business_id }}" else "auto-detected",
          "competitors_processed": [
              {
                  "competitor_id": comp.get('competitor_id'),
                  "competitor_name": comp.get('competitor_name'),
                  "instagram_username": comp.get('instagram_username'),
                  "instagram_url": comp.get('instagram_url'),
                  "business_title": comp.get('business_title'),
                  "business_id": comp.get('business_idea_id')
              } for comp in competitors
          ],
          "configuration": {
              "max_concurrent_analysis": {{ inputs.max_concurrent_analysis }},
              "wait_timeout_minutes": {{ inputs.wait_timeout_minutes }}
          }
      }
      
      # Write final summary to file
      with open('/tmp/final_pipeline_summary.json', 'w') as f:
          json.dump(final_summary, f, indent=2)
      
      print(f"\n🎉 Instagram Analysis Pipeline execution completed!")
      print(f"📋 Final summary saved to final_pipeline_summary.json")
    outputFiles:
      - "/tmp/final_pipeline_summary.json"

  - id: log_pipeline_completion
    type: io.kestra.plugin.core.log.Log
    message: |
      🏁 Instagram Analysis Pipeline Completed Successfully
      
      Total Instagram Competitors Processed: {{ outputs.find_competitors_with_instagram.rows | length }}
      
      Triggered by: {{ inputs.triggered_by }}
      
      Configuration:
      - Max Concurrent: {{ inputs.max_concurrent_analysis }}
      - Timeout: {{ inputs.wait_timeout_minutes }} minutes
      
      Final Summary: {{ json(outputs.generate_final_report.outputFiles['/tmp/final_pipeline_summary.json']) }}

triggers:
  - id: social_media_completion_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "instagram_analysis_after_social_media"
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionOutputs
        expression: "{{ trigger.body.event == 'social_media_extraction_completed' }}"

  - id: manual_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "instagram_analysis_manual"
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionOutputs
        expression: "{{ trigger.body.action == 'trigger_instagram_analysis' }}"

  - id: schedule_trigger_hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"  # Every 2 hours
    inputs:
      triggered_by: "scheduled_execution"
      max_concurrent_analysis: 2
      wait_timeout_minutes: 30 