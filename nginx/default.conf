server {
    listen 80;
    server_name noit.com.co www.noit.com.co;
    
    # Certbot validation route
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
} 