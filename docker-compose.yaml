version: '3.8'
services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=business_ai
    ports:
      - "5435:5432"

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  minio:
    image: minio/minio
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server --console-address ":9001" /data

  mage:
    image: mageai/mageai:latest
    ports:
      - "6789:6789"
    volumes:
      - ./pipelines:/home/src
    environment:
      - MAGE_DATABASE_CONNECTION_URL=postgresql://postgres:postgres@db:5432/business_ai
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
  redis_data:
  pipelines: